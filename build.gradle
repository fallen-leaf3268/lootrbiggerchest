def generatedRefmap = layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')
def rawRefmap = layout.buildDirectory.file('tmp/compileJava/raw-refmap.json')
def patchedRefmap = layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json")

tasks.named('compileJava', JavaCompile).configure {
    outputs.file rawRefmap
    doLast {
        rawRefmap.get().asFile.text = generatedRefmap.get().asFile.text
    }
}

def patchRefmap = tasks.register('patchRefmap') {
    dependsOn tasks.named('compileJava')
    inputs.file(rawRefmap).withPropertyName('rawRefmap')
    inputs.property('manualMappings', manualRefmapMappings)
    outputs.files(generatedRefmap, patchedRefmap)
    doLast {
        def refmap = new groovy.json.JsonSlurper().parse(rawRefmap.get().asFile)
        manualRefmapMappings.each { mixinName, mappings ->
            refmap.mappings[mixinName] = (refmap.mappings[mixinName] ?: [:]) + mappings
            refmap.data.searge[mixinName] = (refmap.data.searge[mixinName] ?: [:]) + mappings
        }
        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(refmap))
        generatedRefmap.get().asFile.text = json
        patchedRefmap.get().asFile.text = json
    }
}

tasks.matching { it.name == 'addMixinsToJar' }.configureEach {
    dependsOn patchRefmap
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn patchRefmap
    inputs.file(patchedRefmap).withPropertyName('patchedRefmap')
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    dependsOn patchRefmap
    inputs.file(patchedRefmap).withPropertyName('patchedRefmap')
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Implementation-Title'    : mod_name,
            'Implementation-Version'  : mod_version,
            'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    dependsOn patchRefmap
    inputs.file(patchedRefmap).withPropertyName('patchedRefmap')
    useJUnitPlatform()
}

tasks.withType(PublishModTask).configureEach {
    dependsOn 'reobfJar'
}

publishMods {
    file = jar.archiveFile
    changelog = file("CHANGELOG.md").exists() ? file("CHANGELOG.md").text : "See GitHub release for changes."
    type = ReleaseType.STABLE
    modLoaders.add("forge")

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "gqo4exdM"
        minecraftVersions.add("1.20.1")
        requires("lootr")
    }
}
