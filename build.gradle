            'load': 'Lnoobanidus/mods/lootr/block/entities/LootrBarrelBlockEntity;m_142466_(Lnet/minecraft/nbt/CompoundTag;)V'
        ],
        'com/lootrbiggerchest/mixin/LootrShulkerBlockEntityMixin': [
            'getContainerSize': 'Lnoobanidus/mods/lootr/block/entities/LootrShulkerBlockEntity;m_6643_()I',
            'saveAdditional': 'Lnoobanidus/mods/lootr/block/entities/LootrShulkerBlockEntity;m_183515_(Lnet/minecraft/nbt/CompoundTag;)V',
