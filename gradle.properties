mod_description=Expand all Lootr container sizes from the default 27 slots to much larger capacities. Supports Chests, Barrels, Shulker Boxes, and Minecarts with independent per-type configuration for rows and columns (up to 20x32). Features an optional random size pool system with configurable weights for each container type, making every loot chest opening a surprise. All sizes are persisted to NBT so they survive reloads. Ideal for modpacks where the default 27 slots just isn't enough.
